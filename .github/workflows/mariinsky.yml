name: Mariinsky Watcher audit only

"on":
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Read-only diagnostic only"
        required: false
        default: "dry_run"
        type: choice
        options:
          - dry_run
      debug_url:
        description: "Optional single Mariinsky event URL (always read-only)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout selected code
        uses: actions/checkout@v4
        with:
          path: main-repo
          persist-credentials: false

      - name: Checkout read-only state snapshot
        uses: actions/checkout@v4
        with:
          ref: theatre-watcher-state
          path: state-snapshot
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: main-repo
        run: pip install -r requirements_v3.txt

      - name: Validate code offline
        working-directory: main-repo
        run: |
          python -m py_compile mariinsky_watcher_v3.py test_mariinsky_watcher_v3.py
          python test_mariinsky_watcher_v3.py
          SELF_TEST=1 python mariinsky_watcher_v3.py

      - name: Read-only diagnostic
        working-directory: main-repo
        env:
          RUN_MODE: dry_run
          DEBUG_URL: ${{ github.event.inputs.debug_url || '' }}
          STATE_FILE: ../state-snapshot/state.json
          AUDIT_FILE: ${{ runner.temp }}/unused-audit.json
          MONTHS_AHEAD: "8"
        run: |
          set -euo pipefail
          python - <<'PY' | tee "$RUNNER_TEMP/watcher-diagnostic.jsonl"
          from unittest.mock import patch
          import mariinsky_watcher_v3 as watcher
          blocked = AssertionError("Unexpected write or POST in read-only diagnostic")
          with patch.object(watcher.SESSION, "post", side_effect=blocked), \
               patch.object(watcher, "save_state", side_effect=blocked), \
               patch.object(watcher, "save_audit", side_effect=blocked):
              watcher.main()
          PY

      - name: Preserve diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watcher-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}/watcher-diagnostic.jsonl
          if-no-files-found: ignore
          retention-days: 7
